name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify committed lib/ matches the build
        run: |
          if ! git diff --exit-code -- lib; then
            echo "::error::lib/ is out of date — run 'pnpm build' and commit the result"
            exit 1
          fi

      - name: Verify package manifest
        run: node -e "const p=require('./package.json'); if(!p.name||!p.exports||!p.dsh) process.exit(1)"
